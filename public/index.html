<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Artifact Market · Jinteia</title>
<meta name="description" content="Buy and sell pet artifacts on Nihor2 – Chronicles of Jinteia. Paste a screenshot to sell, search by stats to buy.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#1a1d22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // motiv hned při načtení, ať stránka neproblikne
  try {
    var t = JSON.parse(localStorage.getItem('pam:theme') || '"system"');
    if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<header>
  <div class="logo">Pet Artifact Market<small>Nihor2 · Chronicles of Jinteia</small></div>
  <nav id="nav"></nav>
  <div class="hright" id="hright"></div>
</header>
<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
